<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Hub | Ref & Donate</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            bg: '#080C14',
                            card: 'rgba(15, 23, 42, 0.75)',
                            border: 'rgba(51, 65, 85, 0.5)',
                            neon: '#10B981',       /* Emerald */
                            cyan: '#06B6D4',       /* Cyber Cyan */
                            textMuted: '#94A3B8'
                        }
                    },
                    boxShadow: {
                        'neon-glow': '0 0 20px rgba(16, 185, 129, 0.15)',
                        'cyan-glow': '0 0 20px rgba(6, 182, 212, 0.15)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #080C14;
            background-image: 
                radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-8 font-sans antialiased selection:bg-cyber-neon selection:text-black">

    <!-- Main Wrapper -->
    <main class="max-w-md w-full my-auto space-y-8">

        <!-- PROFILE HEADER -->
        <header class="text-center space-y-4">
            <!-- Avatar with Cyber Border -->
            <div class="relative w-24 h-24 mx-auto group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-cyber-cyan to-cyber-neon rounded-full blur opacity-50 group-hover:opacity-100 transition duration-500"></div>
                <div class="relative w-full h-full rounded-full bg-slate-950 p-1">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=k9os02" alt="Avatar" class="w-full h-full rounded-full bg-slate-900 object-cover">
                </div>
            </div>

            <!-- Title & Bio -->
            <div class="space-y-1">
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
                    k9os02 <span class="w-2 h-2 rounded-full bg-cyber-neon animate-pulse"></span>
                </h1>
                <p class="text-xs text-cyber-textMuted tracking-wide uppercase font-mono">Crypto Trader • Game Dev • Linux</p>
            </div>

            <!-- Social Links -->
            <div class="flex justify-center gap-3 pt-1">
                <a href="#" target="_blank" class="w-9 h-9 rounded-lg glass-card border border-cyber-border flex items-center justify-center text-slate-400 hover:text-cyber-neon hover:border-cyber-neon/50 transition-all duration-300">
                    <i class="fa-brands fa-telegram text-base"></i>
                </a>
                <a href="#" target="_blank" class="w-9 h-9 rounded-lg glass-card border border-cyber-border flex items-center justify-center text-slate-400 hover:text-cyber-cyan hover:border-cyber-cyan/50 transition-all duration-300">
                    <i class="fa-brands fa-x-twitter text-base"></i>
                </a>
                <a href="#" target="_blank" class="w-9 h-9 rounded-lg glass-card border border-cyber-border flex items-center justify-center text-slate-400 hover:text-red-400 hover:border-red-400/50 transition-all duration-300">
                    <i class="fa-brands fa-youtube text-base"></i>
                </a>
                <a href="#" target="_blank" class="w-9 h-9 rounded-lg glass-card border border-cyber-border flex items-center justify-center text-slate-400 hover:text-purple-400 hover:border-purple-400/50 transition-all duration-300">
                    <i class="fa-brands fa-github text-base"></i>
                </a>
            </div>
        </header>

        <!-- SECTION 1: REFERRAL LINKS -->
        <section class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xs font-mono font-semibold text-cyber-textMuted uppercase tracking-widest flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-cyber-cyan text-xs"></i> Trading Referral
                </h2>
                <span class="text-[10px] font-mono text-slate-500">Fee Discount</span>
            </div>

            <div class="space-y-2.5">
                <!-- Binance -->
                <a href="https://binance.com" target="_blank" class="group flex items-center justify-between p-3.5 glass-card border border-cyber-border hover:border-cyber-cyan/60 rounded-xl transition-all duration-300 hover:shadow-cyan-glow">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-9 h-9 rounded-lg bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 flex items-center justify-center font-bold text-sm">
                            <i class="fa-solid fa-coins"></i>
                        </div>
                        <div>
                            <div class="text-sm font-semibold text-slate-100 group-hover:text-cyber-cyan transition-colors">Binance</div>
                            <div class="text-[11px] text-cyber-textMuted">Giảm 20% phí giao dịch Futures</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-600 group-hover:text-cyber-cyan transition-colors"></i>
                </a>

                <!-- Bybit -->
                <a href="https://bybit.com" target="_blank" class="group flex items-center justify-between p-3.5 glass-card border border-cyber-border hover:border-cyber-neon/60 rounded-xl transition-all duration-300 hover:shadow-neon-glow">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-9 h-9 rounded-lg bg-orange-500/10 border border-orange-500/20 text-orange-400 flex items-center justify-center font-bold text-sm">
                            BY
                        </div>
                        <div>
                            <div class="text-sm font-semibold text-slate-100 group-hover:text-cyber-neon transition-colors">Bybit</div>
                            <div class="text-[11px] text-cyber-textMuted">Thưởng Tân thủ & Giảm phí Taker</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-600 group-hover:text-cyber-neon transition-colors"></i>
                </a>

                <!-- Hyperliquid -->
                <a href="https://hyperliquid.xyz" target="_blank" class="group flex items-center justify-between p-3.5 glass-card border border-cyber-border hover:border-cyber-cyan/60 rounded-xl transition-all duration-300 hover:shadow-cyan-glow">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-9 h-9 rounded-lg bg-cyan-500/10 border border-cyan-500/20 text-cyber-cyan flex items-center justify-center font-bold text-sm">
                            HL
                        </div>
                        <div>
                            <div class="text-sm font-semibold text-slate-100 group-hover:text-cyber-cyan transition-colors">Hyperliquid</div>
                            <div class="text-[11px] text-cyber-textMuted">Perp DEX On-chain mượt nhất</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-600 group-hover:text-cyber-cyan transition-colors"></i>
                </a>
            </div>
        </section>

        <!-- SECTION 2: DONATE ADDRESSES -->
        <section class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xs font-mono font-semibold text-cyber-textMuted uppercase tracking-widest flex items-center gap-2">
                    <i class="fa-solid fa-wallet text-cyber-neon text-xs"></i> Donate Hub
                </h2>
                <span class="text-[10px] font-mono text-slate-500">1-Click Copy</span>
            </div>

            <div class="space-y-2.5">
                <!-- EVM -->
                <div class="p-3.5 glass-card border border-cyber-border rounded-xl space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold text-slate-200 flex items-center gap-2">
                            <i class="fa-brands fa-ethereum text-indigo-400"></i> EVM (ETH / BSC / Arb / Base)
                        </span>
                        <button onclick="copyWallet('0xYOUR_EVM_ADDRESS_HERE', 'btn-evm')" id="btn-evm" class="text-[11px] font-mono bg-slate-800/80 hover:bg-cyber-neon hover:text-slate-950 text-slate-300 px-2.5 py-1 rounded-md border border-slate-700/50 transition-all duration-200">
                            Copy
                        </button>
                    </div>
                    <p class="text-[11px] font-mono text-cyber-textMuted bg-slate-950/60 p-2 rounded-lg border border-slate-800/80 truncate select-all">0xYOUR_EVM_ADDRESS_HERE</p>
                </div>

                <!-- SOL -->
                <div class="p-3.5 glass-card border border-cyber-border rounded-xl space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold text-slate-200 flex items-center gap-2">
                            <i class="fa-solid fa-bolt text-purple-400"></i> Solana (SOL / USDC)
                        </span>
